services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/ecoplan
    depends_on:
      - mongo
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:4000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo-data:
